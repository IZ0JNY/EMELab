[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emelab"
version = "0.1.18"
description = "EMELab — EME measurements, planning, log and station design from 10 to 134 GHz (companion of FeedLab)"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Ivan De Cesaris, IZ0JNY"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "plotly>=5.18", "streamlit>=1.35", "pandas>=2.0",
                "pyerfa>=2.0", "pypdf>=4.0", "timezonefinder>=6.0", "tzdata"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["emelab"]
