name: EMELab per Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install
        run: python -m pip install -r requirements-desktop.txt pytest
      - name: Tests
        run: python -m pytest -q -ra

  decoder:
    name: Q65 Lab decoder (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            git patch
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-fftw
      - name: WSJT-X v3.0.2 sources (GPLv3)
        run: git clone --depth 1 --branch v3.0.2 https://github.com/WSJTX/wsjtx.git wsjtx-src
      - name: Build q65lab.exe
        run: ./decoder/q65lab/build.sh wsjtx-src build/q65lab
      - name: Self-test on a synthetic period
        run: |
          printf 'DECODE missing.wav 0000 60 E 700 200 3 - - - 0 1 1\nQUIT\n' | ./build/q65lab/q65lab.exe | tee out.txt
          grep -q "E ERR cannot read wav" out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: q65lab
          path: build/q65lab/q65lab.exe
          retention-days: 30

  build:
    name: Build installer
    needs: [test, decoder]
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - uses: actions/download-artifact@v4
        with:
          name: q65lab
          path: build/q65lab
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.Substring(1) }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: ./windows/build.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: App script runs in the packaged Python
        shell: pwsh
        working-directory: build/EMELab/app
        run: |
          ..\python\python.exe -c "from streamlit.testing.v1 import AppTest; at = AppTest.from_file('emelab_main.py', default_timeout=600); at.run(); errs = [e.value for e in at.exception]; print('eccezioni:', errs); raise SystemExit(1 if errs else 0)"
      - name: Silent install + server smoke test + screenshot
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\EMELab-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\EMELab"
          if (-not (Test-Path "$app\python\pythonw.exe")) { throw "installazione non trovata" }
          foreach ($exe in "python.exe", "pythonw.exe") {      # interpreters must keep the PSF signature
            $sig = Get-AuthenticodeSignature "$app\python\$exe"
            Write-Host "$exe : $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "$exe senza firma digitale valida" }
          }
          $p = Start-Process "$app\python\python.exe" -ArgumentList "-m","emelab.desktop","--server-only","--port","8765" -WorkingDirectory "$app\app" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            try { if ((Invoke-WebRequest http://127.0.0.1:8765/_stcore/health -UseBasicParsing).Content -eq "ok") { $ok = $true; break } } catch {}
            Start-Sleep 2
          }
          if (-not $ok) { Get-Content "$env:APPDATA\EMELab\server.log" -Tail 50; throw "il server non risponde" }
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (Test-Path $edge) {
            & $edge --headless=new --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=45000 --screenshot="$PWD\dist\screenshot.png" http://127.0.0.1:8765
            Start-Sleep 5
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: EMELab-Windows-${{ steps.ver.outputs.version }}
          path: |
            dist/EMELab-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/screenshot.png
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: EMELab-Windows-portable-${{ steps.ver.outputs.version }}
          path: dist/EMELab-*-portable.zip
          retention-days: 30
      - name: GitHub release (every build of main, and tags v*)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $files = @((Get-ChildItem dist\EMELab-Setup-*.exe).FullName, (Get-ChildItem dist\EMELab-*-portable.zip).FullName, (Get-Item dist\SHA256SUMS.txt).FullName)
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already published: not overwritten (bump the version to publish changes)"
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA --latest --title "EMELab $tag per Windows" --notes-file windows/RELEASE_NOTES.md
          }
